{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cluster.name }}-minio-setup-script
  namespace: {{ .Values.cluster.namespace | default .Release.Namespace }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  minio-setup.sh: |
    #!/bin/sh
    set -e

    SVC_ACCESS_KEY={{ .Values.backup.s3ServiceAccount.accessKey | quote }}
    SVC_SECRET_KEY={{ .Values.backup.s3ServiceAccount.secretKey | quote }}

    echo "==> Configuring MinIO client..."
    mc alias set myminio {{ .Values.minio.endpoint }} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}

    echo "==> Creating bucket '{{ .Values.minio.bucketName }}' (if not exists)..."
    mc mb --ignore-existing myminio/{{ .Values.minio.bucketName }}

    echo "==> Creating/updating service account for Barman Cloud..."
    # Recreate the svc account by known access key so upgrades are idempotent.
    mc admin user svcacct rm myminio "${SVC_ACCESS_KEY}" >/dev/null 2>&1 || true
    mc admin user svcacct add myminio ${MINIO_ROOT_USER} \
      --access-key "${SVC_ACCESS_KEY}" \
      --secret-key "${SVC_SECRET_KEY}" \
      --name barman-backup >/dev/null

    echo "==> Verifying bucket access with service account credentials..."
    mc alias set verify {{ .Values.minio.endpoint }} "${SVC_ACCESS_KEY}" "${SVC_SECRET_KEY}"
    mc ls verify/{{ .Values.minio.bucketName }} > /dev/null 2>&1
    echo "==> Bucket access verified."

    echo "==> Writing credentials for kubectl step..."
    printf "%s" "${SVC_ACCESS_KEY}" > /shared/access_key
    printf "%s" "${SVC_SECRET_KEY}" > /shared/secret_key

  kubectl-setup.sh: |
    #!/bin/sh
    set -e

    KUBE_NS={{ .Values.cluster.namespace | default .Release.Namespace }}
    RELEASE_NAME={{ .Release.Name }}
    RELEASE_NS={{ .Release.Namespace }}
    SECRET_NAME={{ .Values.backup.s3SecretName }}

    ACCESS_KEY=$(cat /shared/access_key)
    SECRET_KEY=$(cat /shared/secret_key)

    if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
      echo "ERROR: Missing credentials from /shared volume"
      exit 1
    fi

    echo "==> Creating/updating Kubernetes secret '${SECRET_NAME}'..."
    kubectl -n "${KUBE_NS}" create secret generic "${SECRET_NAME}" \
      --from-literal={{ .Values.backup.s3AccessKeyIdKey }}="${ACCESS_KEY}" \
      --from-literal={{ .Values.backup.s3AccessSecretKeyKey }}="${SECRET_KEY}" \
      --dry-run=client -o yaml | kubectl apply -f -

    # Ensure Helm can track/adopt this secret safely across upgrades.
    kubectl -n "${KUBE_NS}" label secret "${SECRET_NAME}" app.kubernetes.io/managed-by=Helm --overwrite
    kubectl -n "${KUBE_NS}" annotate secret "${SECRET_NAME}" meta.helm.sh/release-name="${RELEASE_NAME}" --overwrite
    kubectl -n "${KUBE_NS}" annotate secret "${SECRET_NAME}" meta.helm.sh/release-namespace="${RELEASE_NS}" --overwrite

    echo "==> MinIO setup complete!"
    echo "    Bucket: {{ .Values.minio.bucketName }}"
    echo "    Secret: ${SECRET_NAME}"
{{- end }}
