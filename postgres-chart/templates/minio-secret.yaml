{{- if .Values.backup.staticCredentialsSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backup.s3SecretName }}
  namespace: {{ .Values.cluster.namespace | default .Release.Namespace }}
  labels:
    {{- include "postgres-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3AccessKeyIdKey }}: {{ .Values.backup.staticCredentialsSecret.accessKeyId | quote }}
  {{ .Values.backup.s3AccessSecretKeyKey }}: {{ .Values.backup.staticCredentialsSecret.secretAccessKey | quote }}
{{- end }}
