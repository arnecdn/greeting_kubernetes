# Default values for postgres-chart
# This is a YAML-formatted file.

# Cluster configuration
cluster:
  name: postgres-greeting
  namespace: cnpg-system
  instances: 2  # 2 replicas on a single Minikube node
  enableSuperuserAccess: true  # Allows connecting as postgres superuser (useful for port-forward debugging)

  # Storage configuration
  storage:
    size: 20Gi
    storageClass: standard
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
      selector:
        matchLabels:
          app: postgres-greeting
  # Database configuration
  database:
    name: greeting_rust
    owner: greeting_rust

  # Image configuration
  image:
    catalog:
      major: 17

  # SQL executed during cluster bootstrap
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  # PostgreSQL parameters
  postgresql:
    shared_preload_libraries:
      - pg_tracing
      - pg_stat_statements
    parameters:
      shared_buffers: "128MB"
      # Enable query ID computation for better tracing
      compute_query_id: "on"
      #Trace configuration
      pg_tracing.max_span: "10000"
      pg_tracing.track: "all"
      # Send spans every 2 seconds to an otel collector
      pg_tracing.otel_endpoint: "http://meta-monitoring-alloy.meta-monitoring.svc.cluster.local:4318/v1/traces"
      pg_tracing.otel_naptime: "2000"
      # TCP keepalive settings to prevent idle connection drops (important for port-forwarding)
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
      # Prevent idle replication connections from being dropped
      wal_receiver_timeout: "90s"

# Secret configuration for database credentials
secret:
  name: postgres-greeting-secret
  username: greeting_rust  # Will be base64 encoded
  password: greeting_rust  # Will be base64 encoded

# ConfigMap for PostgreSQL configuration
config:
  enabled: true
  name: postgres-greeting-config
  pg_hba_conf: |
    host all all 0.0.0.0/0 md5
  # pg_hba rules applied directly to the CNPG Cluster spec (affects both primary and replicas)
  pg_hba:
    - host all all 0.0.0.0/0 md5
    - host all all ::/0 md5

# Service configuration (primary - read/write)
service:
  enabled: true
  name: postgres-greeting-service
  type: ClusterIP
  port: 5432
  targetPort: 5432

# Read replica service configuration (read-only)
replicaService:
  enabled: true
  name: postgres-greeting-replica-service
  type: ClusterIP
  port: 5432
  targetPort: 5432

# Image Catalog configuration
imageCatalog:
  enabled: true
  name: postgresql
  images:
    - major: 17
      repository: docker.io/arnecdn/greeting-postgres
      tag: "0.1"
# Backup to Garage
backup:
  enabled: true
  schedule: "0 20 10 * * *"  # Daily at 2 AM (6-field cron: sec min hour dom mon dow)
  objectStoreName: garage-backup-store
  retentionPolicy: 1d
  destinationPath: "s3://barman-cloud-greeting-backup"
  endpointURL: http://garage.garage.svc.cluster.local:3900
  # Secret written by the Job in greeting_kubernetes/garage-chart (do not create it by hand)
  s3SecretName: garage-credentials
  s3AccessKeyIdKey: ACCESS_KEY_ID
  s3AccessSecretKeyKey: ACCESS_SECRET_KEY
  # Key in s3SecretName holding the S3 region; leave empty to use the client default (us-east-1)
  s3RegionKey: REGION
  walCompression: gzip
  walMaxParallel: 2

