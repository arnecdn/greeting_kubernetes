# Monitoring and observability
monitoring:
  enabled: true
  grafana_alloy:
    endpoint: "http://meta-monitoring-alloy.meta-monitoring.svc.cluster.local:4318/v1/traces"
    naptime: 2000

# Resource limits and requests (optional)
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Additional labels and annotations
labels: {}
annotations: {}

# Node selector and tolerations (optional)
nodeSelector: {}
tolerations: []

