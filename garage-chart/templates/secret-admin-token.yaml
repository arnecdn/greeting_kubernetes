apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.adminTokenSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-chart.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $prev := (lookup "v1" "Secret" .Release.Namespace .Values.adminTokenSecret.name) | default dict }}
  {{- $prevToken := (get ($prev.data | default dict) .Values.adminTokenSecret.key) | default "" | b64dec }}
  {{/* Keep the existing token on upgrades, otherwise generate one */}}
  {{ .Values.adminTokenSecret.key }}: {{ $prevToken | default (randAlphaNum 48) | b64enc | quote }}

